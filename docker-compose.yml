services:
  mongodb:
    image: mongo:7
    container_name: harrypotter-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: hpadmin
      MONGO_INITDB_ROOT_PASSWORD: hppassword
      MONGO_INITDB_DATABASE: harrypotter
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: